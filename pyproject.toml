[build-system]
requires = ["poetry_core>=2.5.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "waserver"
description = "Witness Angel Webservices"
version = "0.3"
requires-python = ">=3.11,<3.13"
license-files = ["LICENSE.txt"]
readme = "Readme.rst"
authors = [
    {name="Pascal Chambon"},
    {name="Manon Michelet"},
    {name="Francinette Atchade"},
]
homepage = "https://github.com/WitnessAngel/witness-angel-server"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
]
include = ["CHANGELOG", "tox.ini", "settings.ini", "docs/*", "docs/api/*", "tests/*.py"]
exclude = ["_build"]

dependencies = [
    # Witness Angel system
    # uses up-to-date `dev` branch
    "wacryptolib @ git+https://github.com/WitnessAngel/witness-angel-cryptolib.git@dev",

    # Django & Bson
    "Django >3,<5",
    "json-rpc-django >=1.0, <2.0",
    "schema >=0.7.0,<0.8.0",
    "django_cryptography >=1.0,<2.0",
    "python-decouple >=3.3,<4.0",
    "django-model-utils >=4.1.1,<4.2.0",
    "djangorestframework >=3.0,<4.0",
    "django-changeset >=1.1.0,<1.2.0",
    "django-utils-six >=2.0,<3.0",
    "django-compat-patcher >=0.12,<0.13",
]

[tool.poetry.group.dev.dependencies]
# Test runners and plugins
pytest = ">=7.0.1"
pytest-cov = ">=4.0"
pytest_mock = ">=3.7.0"
pytest-randomly = ">=3.11"
pytest-deadfixtures = ">=2.2.1"
pytest-timeout = ">=2.1.0"
pytest-xdist = ">=3.0.0"
responses = ">=0.18.0"
freezegun = ">=1.1.0"
typeguard = ">=2.13.0"

pytest-django = "^4"
model-bakery = "^1.10.0"
# Linters and formatters
black = {version = ">=22.1.0"}
darglint = ">=1.8.1"
pylint = ">=2.6"
mypy = ">=0.931"
xenon = ">=0.9.0"
safety = ">=1.10"
doc8 = ">=0.10.1"

# Documentation
sphinx = ">=4.4.0"
sphinx-autodoc-typehints = ">=1.17.0"
sphinx_rtd_theme = ">=1.0.0"
toml = ">=0.10.2"

# Frozen executable building
pyinstaller = ">=5"

